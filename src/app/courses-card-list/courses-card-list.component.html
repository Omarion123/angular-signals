@for(course of courses(); track course.id){
<div class="course-card">
  <div class="course-header">
    <span class="course-title">{{ course.title }}</span>
  </div>
  <img [src]="course.iconUrl" [alt]="course.iconUrl" class="course-image" />
  <div class="course-description">
    <p>{{ course.longDescription }}</p>
  </div>
  <div class="course-actions">
    <button class="btn">VIEW COURSE</button>
    <button class="btn" (click)="editCourse(course)">EDIT</button>
    <img src="/assets/icons/delete.svg" alt="delete-icon" class="delete" (click)="onCourseDelete(course)"/>
  </div>
</div>
}
