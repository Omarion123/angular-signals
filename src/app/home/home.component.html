<div class="courses-panel">
  <h3>All Courses</h3>

  <button class="btn" (click)="addCourse()">Add Course</button>
  <button class="btn" (click)="onToObservable()">toObservable</button>
  <button class="btn" (click)="onToSignal()">toSignal</button>

  <mat-tab-group>
    <mat-tab label="Beginners">
      <courses-card-list
        #beginnersList
        MatTooltip="these are beginners course"
        [courses]="beginnersCourses()"
        (courseUpdated)="onCourseUpdated($event)"
        (courseDeleted)="onCourseDeleted($event)"
      />
    </mat-tab>

    <mat-tab label="Advanced">
      <courses-card-list
        [courses]="advancedCourses()"
        (courseUpdated)="onCourseUpdated($event)"
        (courseDeleted)="onCourseDeleted($event)"
      />
    </mat-tab>
  </mat-tab-group>
</div>
